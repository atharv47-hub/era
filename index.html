<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Messenger</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- ================= AUTH ================= -->

<div id="authPage">

    <div class="auth-container">

        <h1>💬 My Messenger</h1>

        <!-- LOGIN -->

        <div id="loginBox">

            <h2>Login</h2>

            <input
                id="loginEmail"
                type="email"
                placeholder="Email"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
            >

            <button onclick="login()">
                Login
            </button>

            <p id="loginMessage"></p>

            <p>
                Don't have an account?
                <span
                    class="link"
                    onclick="showRegister()"
                >
                    Create Account
                </span>
            </p>

        </div>


        <!-- REGISTER -->

        <div
            id="registerBox"
            class="hidden"
        >

            <h2>Create Account</h2>

            <input
                id="registerUsername"
                type="text"
                placeholder="Username"
            >

            <input
                id="registerFullName"
                type="text"
                placeholder="Full Name"
            >

            <input
                id="registerEmail"
                type="email"
                placeholder="Email"
            >

            <input
                id="registerPassword"
                type="password"
                placeholder="Password"
            >

            <button onclick="register()">
                Create Account
            </button>

            <p id="registerMessage"></p>

            <p>
                Already have an account?
                <span
                    class="link"
                    onclick="showLogin()"
                >
                    Login
                </span>
            </p>

        </div>

    </div>

</div>


<!-- ================= MESSENGER ================= -->

<div
    id="messengerPage"
    class="hidden"
>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="profile">

            <div class="big-avatar">
                👤
            </div>

            <div>

                <h3>My Messenger</h3>

                <p id="myUsername">
                    @username
                </p>

            </div>

        </div>


        <div class="sidebar-buttons">

            <button onclick="openAddFriend()">
                ➕ Add Friend
            </button>

            <button onclick="openRequests()">
                📩 Friend Requests
            </button>

            <button onclick="logout()">
                🚪 Logout
            </button>

        </div>


        <input
            id="friendSearch"
            class="search"
            type="text"
            placeholder="Search friends..."
        >


        <h3 class="friends-title">
            FRIENDS
        </h3>


        <div id="friendsList">

            <p class="empty">
                No friends yet
            </p>

        </div>

    </aside>


    <!-- CHAT -->

    <main class="chat">

        <!-- WELCOME -->

        <div
            id="welcomeChat"
            class="welcome"
        >

            <div class="welcome-icon">
                💬
            </div>

            <h1>Welcome to My Messenger</h1>

            <p>
                Select a friend to start chatting.
            </p>

        </div>


        <!-- CHAT HEADER -->

        <div
            id="chatHeader"
            class="chat-header hidden"
        >

            <div class="chat-avatar">
                👤
            </div>

            <div>

                <h3 id="chatFriendName">
                    Friend
                </h3>

                <p id="chatFriendStatus">
                    ● Online
                </p>

            </div>

        </div>


        <!-- MESSAGES -->

        <div
            id="messages"
            class="messages hidden"
        ></div>


        <!-- MESSAGE BOX -->

        <div
            id="messageBox"
            class="message-box hidden"
        >

            <input
                id="messageInput"
                type="text"
                placeholder="Type a message..."
            >

            <button onclick="sendMessage()">
                ➤
            </button>

        </div>

    </main>

</div>


<!-- ================= ADD FRIEND MODAL ================= -->

<div
    id="addFriendModal"
    class="modal hidden"
>

    <div class="modal-box">

        <h2>➕ Add Friend</h2>

        <input
            id="friendUsername"
            type="text"
            placeholder="Enter username"
        >

        <button onclick="addFriend()">
            Send Friend Request
        </button>

        <p id="friendMessage"></p>

        <button
            class="close-button"
            onclick="closeAddFriend()"
        >
            Close
        </button>

    </div>

</div>


<!-- ================= REQUEST MODAL ================= -->

<div
    id="requestsModal"
    class="modal hidden"
>

    <div class="modal-box">

        <h2>📩 Friend Requests</h2>

        <div id="requestsList">
            Loading...
        </div>

        <button
            class="close-button"
            onclick="closeRequests()"
        >
            Close
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
